<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong | Feastly</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #f7f6f4;
      color: #16161a;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
      text-align: center;
    }
    main { max-width: 480px; }
    .code { margin: 0; font-size: clamp(4rem, 14vw, 7rem); font-weight: 800; letter-spacing: -0.05em; color: #f1d9d1; line-height: 1; }
    h1 { margin: 0.5rem 0; font-size: 1.75rem; letter-spacing: -0.02em; }
    p { margin: 0 0 1.5rem; color: #6b6b76; }
    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #d83c13;
      border-radius: 999px;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #16161a; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">500</p>
    <h1>Something went wrong on our side</h1>
    <p>We are sorry. The problem has been noted and we are working on it. Please try again in a few minutes.</p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
